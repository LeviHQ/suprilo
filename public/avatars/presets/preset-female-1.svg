  <!-- Hair Front (Flowing Side Part) -->
  <path d="M78 115 C75 60, 130 50, 175 65 C185 110, 180 150, 175 170 C165 130, 160 85, 130 85 C100 85, 85 98, 78 115 Z" fill="#18181B"/>
  <!-- Eyes with Lashes -->
  <circle cx="112" cy="125" r="4.5" fill="#18181B"/>
  <circle cx="144" cy="125" r="4.5" fill="#18181B"/>
  <path d="M106 122 Q112 118 118 122" stroke="#18181B" stroke-width="2" fill="none"/>
  <path d="M138 122 Q144 118 150 122" stroke="#18181B" stroke-width="2" fill="none"/>
  <!-- Eyebrows -->
  <path d="M104 114 Q112 110 120 114" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M136 114 Q144 110 152 114" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Lips -->
  <path d="M118 152 Q128 160 138 152 Q128 157 118 152 Z" fill="#E11D48"/>
  <!-- Blush -->
  <ellipse cx="98" cy="136" rx="7" ry="4" fill="#FB7185" opacity="0.4"/>
  <ellipse cx="158" cy="136" rx="7" ry="4" fill="#FB7185" opacity="0.4"/>
</svg>
