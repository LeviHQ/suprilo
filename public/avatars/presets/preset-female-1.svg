      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="skin-maya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="128" fill="url(#bg-maya)"/>
  <!-- Long Hair Back -->
  <path d="M72 110 C65 170, 75 220, 85 240 L171 240 C181 220, 191 170, 184 110 Z" fill="#18181B"/>
  <!-- Body/Shirt -->
  <path d="M52 240 C60 185, 196 185, 204 240 Z" fill="#FDF2F8"/>
