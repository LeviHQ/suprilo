  <rect x="168" y="110" width="8" height="20" rx="3" fill="#CBD5E1"/>
  <!-- Mustache -->
  <path d="M114 144 Q128 140 142 144 Q135 152 128 147 Q121 152 114 144 Z" fill="#E2E8F0"/>
  <!-- Spectacles -->
  <circle cx="112" cy="125" r="13" stroke="#94A3B8" stroke-width="2.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="144" cy="125" r="13" stroke="#94A3B8" stroke-width="2.5" fill="rgba(255,255,255,0.2)"/>
  <line x1="125" y1="125" x2="131" y2="125" stroke="#94A3B8" stroke-width="2.5"/>
  <!-- Eyes -->
  <circle cx="112" cy="125" r="3" fill="#1E293B"/>
  <circle cx="144" cy="125" r="3" fill="#1E293B"/>
  <!-- Gentle Smile -->
  <path d="M120 156 Q128 162 136 156" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>
