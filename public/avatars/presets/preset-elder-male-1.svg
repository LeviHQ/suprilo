  <ellipse cx="128" cy="125" rx="44" ry="48" fill="url(#skin-arthur)"/>
  <!-- Distinguished Silver Hair -->
  <path d="M78 115 C75 60, 115 50, 145 50 C178 50, 180 70, 178 115 C168 90, 140 85, 128 85 C108 85, 88 95, 78 115 Z" fill="#CBD5E1"/>
