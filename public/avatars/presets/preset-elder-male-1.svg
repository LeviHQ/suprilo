      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="skin-arthur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="128" fill="url(#bg-arthur)"/>
  <!-- Body/Suit -->
  <path d="M48 240 C56 185, 200 185, 208 240 Z" fill="#0F172A"/>
  <!-- Shirt & Tie -->
  <path d="M110 190 L128 240 L146 190 Z" fill="#E2E8F0"/>
  <path d="M125 190 L128 230 L131 190 Z" fill="#DC2626"/>
