<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
  }
  .font-heading {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .problematic {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.025em; /* tracking-tight */
  }
  .fixed-improved {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.005em;
    word-spacing: 0.1em;
  }
</style>
</head>
<body class="p-6 bg-gray-50 space-y-8">

<div>
  <p class="text-xs text-red-600 font-bold mb-1">BEFORE (Problematic: letter-spacing: -0.025em; default word-spacing):</p>
  <h3 class="problematic text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white">
    Creator Identity
  </h3>
  <h3 class="problematic text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white mt-2">
    Creator Meta & Overview
  </h3>
  <h3 class="problematic text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white mt-2">
    Creator Handle Reservation
  </h3>
</div>

<div>
  <p class="text-xs text-green-600 font-bold mb-1">AFTER (Fixed: word-spacing: 0.1em; letter-spacing: -0.005em / tracking-normal):</p>
  <h3 class="fixed-improved text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white">
    Creator Identity
  </h3>
  <h3 class="fixed-improved text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white mt-2">
    Creator Meta & Overview
  </h3>
  <h3 class="fixed-improved text-lg font-bold text-gray-900 border p-3 rounded-xl bg-white mt-2">
    Creator Handle Reservation
  </h3>
</div>

</body>
</html>
